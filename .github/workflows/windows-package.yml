name: ChatGPT-0002 Windows portable

# Build the Windows x64 portable package from the ChatGPT-0002 branch without changing Claude's branch.
on:
  push:
    branches: [chatgpt-0002]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.x
    - name: Package portable zip
      run: dotnet run --project NAPS2.Tools -- pkg zip -p win64 --nosign -v
    - name: Rename ChatGPT portable zip
      shell: pwsh
      run: |
        $zip = Get-ChildItem -Path 'NAPS2.Setup/publish' -Filter '*.zip' -Recurse | Select-Object -First 1
        if ($null -eq $zip) { throw 'No portable zip found' }
        Rename-Item -LiteralPath $zip.FullName -NewName 'NAPS2-ChatGPT-0002-win-x64.zip'
    - name: Upload portable zip
      uses: actions/upload-artifact@v4
      with:
        name: NAPS2-ChatGPT-0002-win-x64
        path: NAPS2.Setup/publish/**/NAPS2-ChatGPT-0002-win-x64.zip
        if-no-files-found: error
