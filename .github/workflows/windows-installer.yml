name: NAPS2 Nicy-0015 Windows installer

on:
  push:
    branches: [chatgpt-0015]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Install Inno Setup 7
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files\Inno Setup 7\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            winget install --id JRSoftware.InnoSetup.7 --exact --source winget --scope machine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe missing at $iscc" }
          & $iscc /?
      - name: Package Windows x64 EXE installer
        run: dotnet run --project NAPS2.Tools -- pkg exe -p win64 --name nicy-0015 --nosign -v
      - name: Rename installer and verify build
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'NAPS2.Setup/publish' -Filter '*nicy-0015.exe' -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw 'No Nicy installer found' }
          Rename-Item -LiteralPath $exe.FullName -NewName 'NAPS2-Nicy-0015-Setup-win-x64.exe'
          Get-Item -LiteralPath (Join-Path $exe.DirectoryName 'NAPS2-Nicy-0015-Setup-win-x64.exe') | Select-Object Name, Length
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v6
        with:
          name: NAPS2-Nicy-0015-Setup-win-x64-unsigned
          path: NAPS2.Setup/publish/**/NAPS2-Nicy-0015-Setup-win-x64.exe
          if-no-files-found: error
